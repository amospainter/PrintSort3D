services:
  printsort3d:
    # Pulls the published image. Update with: docker compose pull && docker compose up -d
    image: ghcr.io/amospainter/printsort3d:latest
    # To build from this checkout instead of pulling, comment out the line above,
    # uncomment the next one, and run: docker compose up -d --build
    # build: .
    container_name: printsort3d
    ports:
      # Loopback-only by default — reachable at http://localhost:3001 on the Docker host, not
      # from the LAN. To expose it on your network, change this to "3001:3001" AND set
      # PRINTSORT_PASSWORD below (or put an authenticating reverse proxy in front).
      - "127.0.0.1:3001:3001"
    # environment:
    #   PRINTSORT_PASSWORD: "choose-a-strong-password"   # HTTP Basic auth on every request
    #   PRINTSORT_READONLY: "1"                          # reject all catalogue edits
    #   PRINTSORT_CORS_ORIGINS: "https://models.example" # allow a browser app on another origin
    volumes:
      # Persistent app state: SQLite catalog, config.json, thumbnail + asset caches.
      - ${DATA_DIR:-./data}:/data

      # Each folder of print files you want catalogued goes under /models/<name>, read-only.
      # Every immediate subdirectory of /models is picked up automatically as a watched
      # source (PRINTSORT_MODELS_DIR=/models, set in the Dockerfile) and scanned on startup —
      # nothing to add in the Settings page. The <name> becomes the source label.
      - ${MODELS_DIR:-./models}:/models/prints:ro
      # - /srv/downloads/stl:/models/downloads:ro
      # - /mnt/nas/3d:/models/nas:ro
    restart: unless-stopped
